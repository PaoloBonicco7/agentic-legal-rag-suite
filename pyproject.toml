[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agentic-legal-rag-suite"
version = "0.2.0"
description = "Traceable legal question answering over frozen Valle d'Aosta legislation."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = ["lxml>=6", "pydantic>=2.10", "requests>=2.32", "qdrant-client>=1.17,<1.18", "openai>=2", "transformers>=4.45,<5"]

[project.optional-dependencies]
local = ["FlagEmbedding>=1.4,<1.5"]
bm25 = ["fastembed>=0.7"]
ui = ["streamlit>=1.40"]
notebooks = ["ipykernel>=6", "jupyter>=1"]
dev = ["pytest>=8"]

[project.scripts]
legal-rag = "legal_rag.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/legal_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
